<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAR 船体判读</title>
<style>
:root{color-scheme:dark;--bg:#0b1520;--pane:#122331;--line:#294555;--text:#e8f1f4;--dim:#adc1ca;--teal:#68d9c5;--warning:#ffd28a;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1440px;margin:auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:25px;margin:0;letter-spacing:.04em}p{margin:.4em 0}.muted{color:var(--dim);font-size:14px}.role{color:var(--teal);font-weight:650}
.toolbar,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select,textarea,.choose{background:#193343;border:1px solid #345465;border-radius:7px;color:var(--text);font:inherit;padding:8px 11px}
button,.choose{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:var(--teal);border-color:var(--teal);color:#06221e;font-weight:650}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.choose:focus-within{outline:2px solid var(--teal)}
.layout{display:grid;grid-template-columns:minmax(380px,1fr) minmax(245px,325px);gap:14px;margin-top:14px}
.viewer,.panel{border:1px solid var(--line);background:var(--pane);border-radius:10px;min-width:0;padding:12px}
.viewport{background:#050a0e;overflow:auto;height:min(70vh,780px);margin-top:10px;display:block}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:crosshair;touch-action:none}
.panel{display:grid;align-content:start;gap:12px}.panel label{display:block;margin-bottom:5px;font-size:14px}.panel textarea,.panel select{width:100%}
.panel textarea{resize:vertical;min-height:72px}.panel ul{margin:0;padding-left:19px}.panel li{margin:6px 0}
#message{min-height:22px;color:var(--warning);margin-top:10px}#progress,#imageName{font-variant-numeric:tabular-nums}
@media(max-width:850px){.layout{grid-template-columns:1fr}.viewport{height:60vh}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body data-reviewer="A">
<main>
<header><div><h1>SAR 船体判读</h1><p class="muted">逐艘勾画直接可见的船体响应。请明确记录空图或不可完整判读的影像。</p></div><span class="role" id="reviewer"></span></header>
<div class="toolbar">
<label class="choose">打开影像文件夹<input id="imageFiles" type="file" webkitdirectory multiple accept="image/png"></label>
<label class="choose">恢复本人的进度<input id="restore" type="file" accept=".json,application/json"></label>
<button class="primary" id="save" disabled>导出判读 JSON</button>
<span class="muted" id="progress">等待载入影像</span>
</div>
<div class="layout">
<section class="viewer" aria-label="SAR 影像">
<div class="row">
<button id="previous" disabled>上一张</button><button id="next" disabled>下一张</button>
<strong id="imageName">请选择影像</strong>
<label for="view">显示</label><select id="view" disabled><option value="native">原灰度</option><option value="bright">整体增亮</option></select>
<label for="zoom">缩放</label><select id="zoom" disabled><option value="1">适合窗口</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select>
</div>
<div class="viewport"><canvas id="canvas" width="1024" height="1024" aria-label="在原生影像上添加多边形顶点"></canvas></div>
</section>
<aside class="panel" aria-label="判读记录">
<div><label for="label">当前轮廓</label><select id="label" disabled><option value="ship_hull">可辨船体</option><option value="uncertain">船体或边界不确定</option><option value="truncated">被窗边截断</option></select></div>
<div class="row"><button class="primary" id="finish" disabled>闭合轮廓</button><button id="undo" disabled>撤销顶点</button></div>
<p class="muted">点击影像依次加点，至少三个顶点。尾迹、阴影、岸线和脱离船体的强散射留在轮廓外。</p>
<ul id="shapes" aria-label="已有轮廓"></ul>
<div><label for="status">当前影像状态</label><select id="status" disabled><option value="unreviewed">等待判读</option><option value="complete">完成，有轮廓</option><option value="complete_empty">完成，未见可画目标</option><option value="incomplete">无法完成整图判读</option></select></div>
<div><label for="notes">备注</label><textarea id="notes" disabled placeholder="记录不确定或未完整判读的原因"></textarea></div>
</aside>
</div>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script id="manifest" type="application/json">{"schema":"sar-hull-roster-v1","images":[]}</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const labelNames = {ship_hull:"船体", uncertain:"不确定", truncated:"截断"};
const colors = {ship_hull:"#68d9c5", uncertain:"#ffd28a", truncated:"#f0a0bd"};
const modes = new Set(["native","bright"]);
const statuses = new Set(["complete","complete_empty","incomplete","unreviewed"]);
const reviewer = document.body.dataset.reviewer;
const roster = JSON.parse($("manifest").textContent).images;
const ctx = $("canvas").getContext("2d");
const state = {entries:[], index:0, image:null, vertices:[], load:0};
$("reviewer").textContent = "独立判读者 " + reviewer;
const entry = () => state.entries[state.index];
const message = value => { $("message").textContent = value; };
const round = x => Math.round(x * 1000) / 1000;

function validPolygon(points, width, height) {
  if (!Array.isArray(points) || points.length < 3) return false;
  for (const point of points) {
    if (!Array.isArray(point) || point.length !== 2 || !point.every(Number.isFinite)) return false;
    if (point[0] < 0 || point[0] > width || point[1] < 0 || point[1] > height) return false;
  }
  if (new Set(points.map(p => p.join(","))).size !== points.length) return false;
  const turn = (a,b,c) => (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
  const within = (a,b,c) => Math.min(a[0], b[0]) <= c[0] && c[0] <= Math.max(a[0], b[0]) &&
                            Math.min(a[1], b[1]) <= c[1] && c[1] <= Math.max(a[1], b[1]);
  let doubledArea = 0;
  for (let i = 0; i < points.length; i++) {
    const next = (i+1)%points.length, a=points[i], b=points[next];
    doubledArea += a[0]*b[1]-b[0]*a[1];
    for (let j=i+2; j<points.length; j++) {
      const finish = (j+1)%points.length;
      if (finish === i) continue;
      const c=points[j], d=points[finish], abC=turn(a,b,c), abD=turn(a,b,d), cdA=turn(c,d,a), cdB=turn(c,d,b);
      if ((abC*abD < 0 && cdA*cdB < 0) || (abC === 0 && within(a,b,c)) || (abD === 0 && within(a,b,d)) ||
          (cdA === 0 && within(c,d,a)) || (cdB === 0 && within(c,d,b))) return false;
    }
  }
  return Math.abs(doubledArea)>1e-6;
}

function path(points, color, closed) {
  if (!points.length) return;
  ctx.beginPath(); ctx.moveTo(...points[0]);
  for (const v of points.slice(1)) ctx.lineTo(...v);
  if (closed) ctx.closePath();
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  if (!closed) {
    ctx.fillStyle=color;
    for (const p of points) { ctx.beginPath(); ctx.arc(...p,3,0,2*Math.PI); ctx.fill(); }
  }
}
function draw() {
  ctx.clearRect(0,0,$("canvas").width,$("canvas").height);
  if (!state.image) return;
  ctx.filter = $("view").value==="bright" ? "brightness(2)" : "none";
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(state.image,0,0);
  ctx.filter="none";
  for (const shape of entry().shapes) path(shape.points,colors[shape.label],true);
  path(state.vertices,colors[$("label").value],false);
}
function refresh() {
  const current=entry(), available=state.entries.length>0, drawing=state.vertices.length>0;
  for (const id of ["save","view","zoom","label","status","notes"]) $(id).disabled=!available;
  $("next").disabled=!available||drawing||state.index===state.entries.length-1;
  $("previous").disabled=!available||drawing||state.index===0;
  $("finish").disabled=state.vertices.length<3;
  $("undo").disabled=!drawing;
  if (!current) return;
  $("imageName").textContent=current.image_id;
  $("status").value=current.status;
  $("notes").value=current.notes;
  const completed=state.entries.filter(x=>x.status!=="unreviewed").length;
  $("progress").textContent=(state.index+1)+"/"+state.entries.length+" 张影像 · 已记录 "+completed+" 张";
  $("shapes").replaceChildren(...current.shapes.map(shape=>{
    const li=document.createElement("li"), b=document.createElement("button");
    b.type="button"; b.textContent="删除";
    b.setAttribute("aria-label","删除轮廓 "+shape.id);
    b.addEventListener("click",()=>{
      current.shapes=current.shapes.filter(v=>v.id!==shape.id);
      current.status="unreviewed"; refresh(); draw();
    });
    li.append(labelNames[shape.label]+" "+shape.id+" ",b);
    return li;
  }));
}
async function chooseImage(index) {
  const token=++state.load;
  state.index=index;
  const candidate=entry();
  if (state.image) { state.image.close(); state.image=null; }
  const bitmap=await createImageBitmap(candidate.file);
  if (token!==state.load){bitmap.close();return;}
  if (bitmap.width!==candidate.width || bitmap.height!==candidate.height) {bitmap.close();throw Error("尺寸不一致");}
  state.image=bitmap;
  $("canvas").width=bitmap.width; $("canvas").height=bitmap.height;
  $("view").value="native";
  if (!candidate.modes.includes("native")) candidate.modes.push("native");
  refresh(); draw();
}
async function loadFolder(files) {
  const byName=new Map();
  for (const file of files) {
    if (!/^UMB-[0-9]{3}\.png$/.test(file.name)) continue;
    if (byName.has(file.name)) throw Error("影像名重复");
    byName.set(file.name,file);
  }
  if (!byName.size) throw Error("请选择含 UMB 编号 PNG 的 images 文件夹");
  if (roster.length && byName.size!==roster.length) throw Error("影像数量与当前名单不一致");
  const expected = roster.length ? roster : Array.from(byName.keys()).sort().map(name=>({image_id:name.slice(0,-4)}));
  const records=[];
  for (const item of expected) {
    const file=byName.get(item.image_id+".png");
    if (!file) throw Error("影像缺失 "+item.image_id);
    if (item.png_sha256) {
      const hash=await crypto.subtle.digest("SHA-256",await file.arrayBuffer());
      const value=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,"0")).join("");
      if (value!==item.png_sha256) throw Error("影像核验失败 "+item.image_id);
    }
    const bmp=await createImageBitmap(file);
    const width=bmp.width,height=bmp.height;
    bmp.close();
    if (item.width && (width!==item.width || height!==item.height)) throw Error("影像尺寸不符");
    records.push({file,image_id:item.image_id,width,height,status:"unreviewed",notes:"",modes:[],shapes:[]});
  }
  state.entries=records; state.vertices=[];
  await chooseImage(0); message("影像已核验，可开始判读");
}
async function restore(file) {
  if (!entry()) throw Error("请先载入当前影像");
  const prior=JSON.parse(await file.text());
  if (prior.schema!=="sar-hull-review-v1" || prior.reviewer!==reviewer ||
      !Array.isArray(prior.images) || prior.images.length!==state.entries.length) throw Error("该文件不对应当前判读者或影像名单");
  const saved=new Map(prior.images.map(x=>[x.image_id,x]));
  const restored=state.entries.map(x=>{
    const y=saved.get(x.image_id);
    if (!y || x.width!==y.width || x.height!==y.height || !statuses.has(y.status) ||
        typeof y.notes!=="string" || !Array.isArray(y.modes) || !y.modes.every(v=>modes.has(v)) ||
        !Array.isArray(y.shapes) || !y.shapes.every(s=>Number.isInteger(s.id)&&s.id>0&&
          Object.hasOwn(labelNames,s.label)&&validPolygon(s.points,x.width,x.height)) ||
        new Set(y.shapes.map(s=>s.id)).size!==y.shapes.length ||
        (y.status==="complete_empty"&&y.shapes.length) || (y.status==="complete"&&!y.shapes.length))
      throw Error("保存文件不匹配 "+x.image_id);
    return {...x,status:y.status,notes:y.notes,modes:[...new Set(y.modes)],
      shapes:y.shapes.map(({id,label,points})=>({id,label,points}))};
  });
  state.entries=restored;state.vertices=[];await chooseImage(state.index);message("已恢复本人判读");
}
function save() {
  if (state.vertices.length) {message("请先闭合当前轮廓或撤销未完成顶点");return;}
  const data={schema:"sar-hull-review-v1",reviewer,images:state.entries.map(({file,...record})=>record)};
  const href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)+"\n"],{type:"application/json"}));
  const a=document.createElement("a");
  a.href=href;a.download="SAR_ship_review_"+reviewer+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(href),1000);
  const pending=state.entries.filter(x=>x.status==="unreviewed").length;
  message(pending ? "已导出进度。仍有 "+pending+" 张等待判读。" : "已导出判读记录");
}
$("imageFiles").addEventListener("change",async e=>{
  if (state.entries.length && !confirm("更换文件夹将清除当前工作区。是否继续？")) return;
  try{await loadFolder(e.target.files);}catch(err){message(err.message);}
});
$("restore").addEventListener("change",async e=>{
  try{if(e.target.files.length) await restore(e.target.files[0]);}catch(err){message(err.message);}
  e.target.value="";
});
$("canvas").addEventListener("pointerdown", e=>{
  if (!state.image || e.button!==0) return;
  const box=$("canvas").getBoundingClientRect(), {width,height}=entry();
  const x=round(Math.max(0,Math.min(width,(e.clientX-box.left)/box.width*width)));
  const y=round(Math.max(0,Math.min(height,(e.clientY-box.top)/box.height*height)));
  state.vertices.push([x,y]); refresh(); draw();
});
$("finish").onclick=()=>{
  const current=entry();
  if (!validPolygon(state.vertices,current.width,current.height)){message("轮廓相交或面积为零，请撤销后重新描画");return;}
  const id=1+Math.max(0,...current.shapes.map(s=>s.id));
  current.shapes.push({id,label:$("label").value,points:state.vertices});
  current.status="unreviewed";state.vertices=[];refresh();draw();message("");
};
$("undo").onclick=()=>{state.vertices.pop();refresh();draw();};
$("label").onchange=draw;
$("zoom").onchange=()=>{$("canvas").style.width=(100*Number($("zoom").value))+"%";};
$("view").onchange=()=>{const v=$("view").value;if(!entry().modes.includes(v))entry().modes.push(v);draw();};
$("notes").oninput=()=>{entry().notes=$("notes").value;};
$("status").onchange=()=>{
  const current=entry(), value=$("status").value;
  if ((value==="complete_empty"&&current.shapes.length) || (value==="complete"&&!current.shapes.length)){
    message("影像状态应与已画轮廓一致");refresh();return;
  }
  current.status=value;refresh();message("");
};
for(const [id,shift] of [["previous",-1],["next",1]]) $(id).onclick=()=>{
  chooseImage(state.index+shift).catch(err=>message(err.message));
};
$("save").onclick=save;
</script>
</body>
</html>
